name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: cosmic
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cosmic_motion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cosmic -d cosmic_motion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cosmic:ci-password@localhost:5432/cosmic_motion_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --require-hashes -r requirements.lock -r requirements-build.lock
      - run: pip install --require-hashes -r requirements-test.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check app tests migrations ../scripts
      - run: pytest
      - run: python -m app.pipeline.cli
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  movie-handoff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handoff/player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: handoff/player/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: [backend, frontend, movie-handoff]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Check which production projects changed
        run: python3 infra/vercel/deploy.py plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.plan.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        if: steps.plan.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Deploy API and worker
        if: steps.plan.outputs.api == 'true'
        run: python3 infra/vercel/deploy.py api
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy frontend
        if: steps.plan.outputs.frontend == 'true'
        run: python3 infra/vercel/deploy.py frontend
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
