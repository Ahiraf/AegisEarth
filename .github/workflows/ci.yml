name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cosmic
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: cosmic_motion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cosmic -d cosmic_motion_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cosmic:ci-password@localhost:5432/cosmic_motion_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check app tests migrations ../scripts
      - run: pytest
      - run: python -m app.pipeline.cli
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
