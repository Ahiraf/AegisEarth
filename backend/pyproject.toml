[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisearth-api"
version = "0.1.0"
description = "SPHEREx image comparison and moving-source candidate backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "astropy>=7,<9",
  "boto3>=1.40,<2",
  "psutil>=6,<8",
  "scipy>=1.14,<2",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
imaging = ["numpy>=2,<3", "scipy>=1.14,<2", "photutils>=2,<4", "reproject>=0.14,<1", "pillow>=11,<13"]
research = ["matplotlib>=3.9,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8", "psutil>=6,<8"]

[project.scripts]
cosmic-pipeline = "app.pipeline.cli:main"
cosmic-worker = "app.modules.views.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["modules/analyses/*.sql", "modules/observations/*.sql", "modules/views/*.sql", "modules/preprocessing/*.sql", "modules/bands/*.json", "modules/targets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
target-version = "py312"
line-length = 100
