target-version = "py312"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "FURB", "BLE"]
allowed-confusables = ["×"]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"scripts/*.py" = ["E402"] # Local CLI entry points add backend/ to the import path first.
