name: cosmic-motion-ai
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosmic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-cosmic_motion}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["cosmic_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cosmic}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-cosmic_motion}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cosmic}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-cosmic_motion}
      CORS_ORIGINS: '["http://localhost:5173"]'
      PUBLIC_TOKEN_SECRET: ${PUBLIC_TOKEN_SECRET:-local-development-view-token-secret-change-before-hosting-2026}
      PUBLIC_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["cosmic_artifact_cache:/app/var/artifacts"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.modules.views.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cosmic}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-cosmic_motion}
    volumes: ["cosmic_artifact_cache:/app/var/artifacts"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:7860"]
    depends_on: [api]
volumes:
  cosmic_postgres_data:
  cosmic_artifact_cache:
